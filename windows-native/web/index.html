<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZDM · 下载管理器</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --border:#e3e8ef; --text:#1f2937; --muted:#6b7280;
    --accent:#2563eb; --accent-soft:#eff4ff; --ok:#16a34a; --warn:#d97706; --err:#dc2626;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
    --radius:10px;
  }
  *{box-sizing:border-box}
  /* 15px base: the desktop build is tuned for 150% scaling, and browsers apply
     the OS scale factor on top of this, so the effective text lands around the
     same visual size as the native app. */
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Source Han Sans SC",sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--panel);
    border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
  .logo svg{width:24px;height:24px}
  .spacer{flex:1}
  button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--panel);
    color:var(--text);padding:7px 12px;border-radius:8px;transition:.15s}
  button:hover{background:#f3f4f6}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:#1d4fd8}
  button.icon{padding:6px 8px;line-height:1}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,select{font:inherit;padding:7px 10px;border:1px solid var(--border);border-radius:8px;
    background:#fff;color:var(--text);outline:none}
  input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  main{max-width:1180px;margin:0 auto;padding:18px 20px 60px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow)}
  .addbar{display:flex;gap:8px;padding:12px;margin-bottom:14px;flex-wrap:wrap}
  .addbar input.url{flex:1;min-width:260px}
  /* 轨道选择单独一行（flex-wrap 下 width:100% 就是自己一行），只在 m3u8/mpd 时出现 */
  .trkbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%}
  /* .trkbar 的 display:flex 比 UA 样式的 [hidden]{display:none} 优先级高，
     不补这一条，粘贴非 m3u8 链接时轨道条也一直挂着。 */
  .trkbar[hidden]{display:none}
  .trkbar span{font-size:12px;color:var(--muted)}
  .trkbar input,.trkbar select{width:168px;font-size:12px}
  .trkline{font-size:11px;color:var(--muted)}
  .toolbar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);
    flex-wrap:wrap}
  .tabs{display:flex;gap:4px}
  .tab{padding:5px 12px;border-radius:999px;border:1px solid transparent;cursor:pointer;color:var(--muted)}
  .tab.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .stats{margin-left:auto;color:var(--muted);font-size:14px}
  .stats b{color:var(--text)}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:8px 12px;
    border-bottom:1px solid var(--border);background:#fafbfc}
  td{padding:10px 12px;border-bottom:1px solid #f0f2f5;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .fname{font-weight:600;word-break:break-all}
  .sub{color:var(--muted);font-size:13px;margin-top:2px;word-break:break-all}
  .bar{height:7px;border-radius:999px;background:#e8ecf1;overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
  .s-downloading{background:#e0f2fe;color:#0369a1}
  .s-completed{background:#dcfce7;color:#15803d}
  .s-paused{background:#fef3c7;color:#b45309}
  .s-error{background:#fee2e2;color:#b91c1c}
  .s-queued{background:#f1f5f9;color:#475569}
  .s-canceled{background:#f1f5f9;color:#64748b}
  .s-merging{background:#ede9fe;color:#6d28d9}
  .actions{display:flex;gap:6px;justify-content:flex-end}
  .empty{padding:48px;text-align:center;color:var(--muted)}
  dialog{border:none;border-radius:12px;padding:0;width:520px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  dialog::backdrop{background:rgba(15,23,42,.35)}
  .dlg-h{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700}
  .dlg-b{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:13px;color:var(--muted)}
  .field.full{grid-column:1/-1}
  .dlg-f{padding:12px 18px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--border)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;
    padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}
  .hint{color:var(--muted);font-size:13px;padding:10px 14px;border-top:1px solid var(--border)}
  code{background:#f3f4f6;padding:1px 5px;border-radius:4px;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/>
    </svg>
    <span>ZDM</span>
  </div>
  <span class="sub" id="svc" style="color:var(--muted);font-size:13px"></span>
  <div class="spacer"></div>
  <button id="btnAdd">＋ 新建下载</button>
  <button id="btnSettings">⚙ 设置</button>
</header>

<main>
  <div class="card addbar">
    <input class="url" id="url" placeholder="粘贴下载链接 http(s)://…  支持直接拖入链接">
    <input id="fname" placeholder="文件名（可选）" style="width:180px">
    <input id="fconn" type="number" min="1" max="32" placeholder="连接数" style="width:88px" title="连接数，留空用默认">
    <button class="primary" id="btnGo">下载</button>
    <div class="trkbar" id="trkBar" hidden>
      <span>HLS/DASH 轨道（留空＝自动挑最佳；只在内置流媒体引擎下生效）</span>
      <input id="fsv" placeholder='视频轨 如 res="1280"' title='引擎的轨道选择语法：子键=值，多个用冒号分隔。常用子键：id / lang / name / codecs / res / for；也可整体写 all / best / best2 / worst1。命中 0 条轨道时任务会失败。'>
      <input id="fsa" placeholder='音频轨 如 lang="spa"' title='同上，例：lang="eng" 或 best'>
      <input id="fss" placeholder='字幕轨 如 lang="eng"' title='同上，例：lang="eng" 或 all'>
      <select id="fsf" title="字幕落成的格式">
        <option value="">字幕格式：引擎默认</option>
        <option value="SRT">字幕格式：SRT</option>
        <option value="VTT">字幕格式：VTT</option>
      </select>
      <input id="fliv" placeholder='直播录制上限 如 30:00' style="width:170px"
        title='只对接到「还在播的」直播流（m3u8 里还没有 #EXT-X-ENDLIST）时生效：录到时长就收工，已录的部分封成成品。&#10;留空＝一直录到你点「停止录制」或直播自己结束。写 30:00 或 1:00:00 都行，上限 24 小时。&#10;很多直播站只保留最近几十秒分片，设得比站点窗口短并不会只下这么长；点播不受这项影响。'>
    </div>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="tabs">
        <span class="tab active" data-f="all">全部</span>
        <span class="tab" data-f="downloading">进行中</span>
        <span class="tab" data-f="paused">已暂停</span>
        <span class="tab" data-f="completed">已完成</span>
      </div>
      <button id="btnPauseAll">全部暂停</button>
      <button id="btnResumeAll">全部继续</button>
      <button id="btnClear">清除已完成</button>
      <div class="stats" id="stats"></div>
    </div>
    <div id="tableWrap">
      <table>
        <thead><tr>
          <th style="width:38%">文件</th>
          <th style="width:16%">大小</th>
          <th style="width:22%">进度</th>
          <th style="width:10%">速度</th>
          <th style="width:14%">操作</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>还没有下载任务 —— 粘贴链接到上方，或安装浏览器扩展一键接管下载</div>
    </div>
    <div class="hint">
      浏览器扩展：打开 <code>chrome://extensions</code> → 开发者模式 → 加载已解压的扩展 → 选择本项目 <code>extension/</code> 目录。
      开启「接管浏览器下载」后，Chrome 的下载会自动交给 ZDM 多线程下载。
    </div>
  </div>
</main>

<dialog id="dlgSettings">
  <div class="dlg-h">设置</div>
  <div class="dlg-b">
    <div class="field full"><label>下载目录</label><input id="cfgDir"></div>
    <div class="field"><label>单任务连接数</label><input id="cfgConn" type="number" min="1" max="32"></div>
    <div class="field"><label>同时下载任务数</label><input id="cfgActive" type="number" min="1" max="16"></div>
    <div class="field"><label>限速 (KB/s，0=不限)</label><input id="cfgSpeed" type="number" min="0"></div>
    <div class="field"><label>失败重试次数</label><input id="cfgRetry" type="number" min="0" max="20"></div>
    <div class="field"><label>代理 (http://host:port)</label><input id="cfgProxy" placeholder="留空则不使用代理"></div>
    <div class="field"><label>服务端口</label><input id="cfgPort" type="number" min="1024" max="65535"></div>
    <div class="field full"><label><input type="checkbox" id="cfgAuto"> 重启后自动继续未完成任务</label></div>
  </div>
  <div class="dlg-f">
    <button id="btnOpenDir">打开下载目录</button>
    <button class="primary" id="btnSaveCfg">保存</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let tasks = [], config = {}, filter = 'all';

const fmtSize = n => {
  n = Number(n) || 0;
  if (n < 1024) return n + ' B';
  const u = ['KB','MB','GB','TB'];
  let i = -1; do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return n.toFixed(1) + ' ' + u[i];
};
const fmtTime = s => {
  if (s == null || !isFinite(s)) return '—';
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  return h ? `${h}h${m}m` : m ? `${m}m${sec}s` : `${sec}s`;
};
// 直播录制没有「已下 X / 共 Y」：分片是边录边追加的，能如实展示的是录了多久。
const fmtRecorded = s => {
  s = Math.max(0, Math.round(Number(s) || 0));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
           : `${m}:${String(sec).padStart(2,'0')}`;
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const statusText = {queued:'排队中',downloading:'下载中',paused:'已暂停',completed:'已完成',error:'失败',canceled:'已取消',merging:'合并中'};

// 轨道选择只对 m3u8/mpd 直链有意义（带查询串的真实地址也要认，所以不截 ?）。
const STREAM_URL_HINT = /\.(m3u8|mpd)(\?|#|$)/i;
const isStreamUrl = u => STREAM_URL_HINT.test(String(u || '').trim());
function toggleTrkBar(){
  // 只切可见性，不清空输入框：URL 是边打边校验的，中途退掉一个字符就把
  // 用户填好的选择器抹掉，比留着更伤人。提交时靠「轨道条是否可见」决定发不发。
  $('#trkBar').hidden = !isStreamUrl($('#url').value);
}
$('#url').addEventListener('input', toggleTrkBar);
function tracksSummary(t){
  const p = [];
  if (t.stream_video) p.push('视频=' + t.stream_video);
  if (t.stream_audio) p.push('音频=' + t.stream_audio);
  if (t.stream_subtitle) p.push('字幕=' + t.stream_subtitle);
  if (t.stream_sub_format) p.push('字幕格式=' + t.stream_sub_format);
  return p.length ? '轨道 ' + p.join(' ') : '';
}

let stateWarn = '';
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

async function api(method, path, body){
  // fetch 断连、服务没起、返回 HTML（端口被别的程序占了）都会让这里抛异常；
  // 以前调用方一律 await api(...) 后读 r.ok，异常直接变成「点了没反应」。
  // 统一回一个 {ok:false,error:...}，界面上的每个按钮才有得可显示。
  let r;
  try {
    r = await fetch('/api/' + path, {
      method, headers:{'Content-Type':'application/json'},
      body: body ? JSON.stringify(body) : undefined });
  } catch (e) {
    return { ok:false, error:'连不上本地服务：' + ((e && e.message) || e) };
  }
  let d;
  try { d = await r.json(); } catch (_) { d = null; }
  if (!d || typeof d !== 'object') {
    // 200 但正文不是 JSON：端口被别的程序占了，或返回的是 HTML 错误页。
    // 以前这里当作「成功但没数据」透传，界面显示「操作完成」而任务没变化。
    if (r.ok) return { ok:false, error:'服务返回 HTTP ' + r.status + '，但响应不是 JSON' };
    d = {};
  }
  if (!r.ok || d.ok === false) {
    return { ...d, ok:false, error: d.error || ('服务返回 HTTP ' + r.status) };
  }
  return d;
}

function render(){
  const list = tasks.filter(t => filter==='all' ? true
    : filter==='downloading' ? ['downloading','queued','merging'].includes(t.status)
    : t.status===filter);
  $('#empty').hidden = list.length > 0;
  let speedSum = 0, html = '';
  for (const t of list){
    if (t.status==='downloading') speedSum += t.speed || 0;
    const pct = t.size ? Math.min(100, t.progress) : (t.status==='completed' ? 100 : 0);
    const canPause = ['downloading','queued'].includes(t.status);
    const canResume = ['paused','error','canceled'].includes(t.status);
    const done = t.status==='completed';
    const merging = t.status==='merging';
    // 直播任务的状态要说清两件事：在录还是在等开播，以及已经录了多久。
    // 引擎在直播没开始时也会一直显示 100%（那是「窗口占满度」），照搬百分比
    // 会让用户以为已经下完了。
    const rec = n => Math.max(0, Math.round(Number(n) || 0));
    const liveOn = !!t.live && ['queued','downloading','merging'].includes(t.status);
    const liveWait = liveOn && !rec(t.live_recorded) && t.live_state === 'Waiting';
    const pillText = liveOn ? (liveWait ? '等直播开始…' : '直播中')
                             : (statusText[t.status]||esc(t.status));
    html += `<tr>
      <td>
        <div class="fname">${esc(t.filename)}</div>
        <div class="sub">${esc(t.url)}${t.error ? ' · <span style="color:var(--err)">'+esc(t.error)+'</span>' : ''}${t.stream_note ? ' · <span style="color:var(--warn)" title="换引擎的理由">'+esc(t.stream_note)+'</span>' : ''}${tracksSummary(t) ? ' · <span class="trkline">'+esc(tracksSummary(t))+'</span>' : ''}</div>
      </td>
      <td>${fmtSize(t.downloaded)} / ${t.size ? fmtSize(t.size) : '未知'}</td>
      <td>
        <div class="bar"><i style="width:${pct}%;background:${done?'var(--ok)':'var(--accent)'}"></i></div>
        <div class="sub">${liveOn ? '' : pct.toFixed(1)+'% · '}<span class="pill s-${esc(t.status)}">${pillText}</span>
        ${liveOn && !liveWait ? '· 已录 '+fmtRecorded(t.live_recorded)+(rec(t.stream_live_limit)?' / '+fmtRecorded(t.stream_live_limit):'') : ''}
        ${t.status==='downloading' && !liveOn ? '· 剩余 '+fmtTime(t.eta) : ''}
        ${liveOn && rec(t.stream_live_limit) && t.status==='downloading' ? '· 剩 '+fmtTime(Math.max(0, rec(t.stream_live_limit)-rec(t.live_recorded))) : ''}</div>
      </td>
      <td>${t.status==='downloading' ? fmtSize(t.speed)+'/s' : '—'}</td>
      <td><div class="actions">
        ${canPause ? `<button class="icon" data-a="pause" data-id="${esc(t.id)}" title="${t.live && t.status==='downloading' ? '停止录制（已录的部分会保存下来）' : '暂停'}">⏸</button>` : ''}
        ${canResume ? `<button class="icon" data-a="resume" data-id="${esc(t.id)}" title="继续">▶</button>` : ''}
        ${!done && !merging ? `<button class="icon" data-a="restart" data-id="${esc(t.id)}" title="重新下载">⟳</button>` : ''}
        ${done ? `<button class="icon" data-a="open" data-id="${esc(t.id)}" title="打开文件位置">📂</button>` : ''}
        <button class="icon" data-a="del" data-id="${esc(t.id)}" title="删除任务（保留文件）">✕</button>
      </div></td>
    </tr>`;
  }
  $('#rows').innerHTML = html;
  const act = tasks.filter(t=>t.status==='downloading').length;
  $('#stats').innerHTML = `进行中 <b>${act}</b> · 总速度 <b>${fmtSize(speedSum)}/s</b> · 共 ${tasks.length} 项`;
}

$('#rows').addEventListener('click', async e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const id = b.dataset.id, a = b.dataset.a;
  if (a === 'del'){
    const t = tasks.find(x => x.id === id);
    const name = t && t.filename ? `「${t.filename}」` : '这个任务';
    // 浏览器里没有可靠的「删文件」确认层级，默认只删记录；
    // 已下载的文件保留在磁盘上，用户可以自己处理。
    if (!confirm(`删除${name}？\n\n只删除任务记录，已下载的文件会保留。`)) return;
    const r = await api('DELETE', `tasks/${encodeURIComponent(id)}?files=0`);
    if (!r.ok) { toast(r.error || '删除失败'); return; }
    tasks = tasks.filter(t => t.id !== id);
  } else {
    const r = await api('POST', `tasks/${encodeURIComponent(id)}/${a}`, {});
    if (!r.ok) toast(r.error || '操作失败');
  }
  refresh();
});

async function refresh(){
  try{
    const st = await (await fetch('/api/state')).json();
    tasks = st.tasks || []; config = st.config || {};
    // 服务端把「历史文件读坏了 / 设置没写进磁盘」放在 warning 里；同一条只提醒一次。
    if (st.warning && st.warning !== stateWarn){ stateWarn = st.warning; toast(st.warning); }
    $('#svc').textContent = '本地服务已连接 · 端口 ' + (config.port || 9000);
    render();
  }catch(e){ $('#svc').textContent = '服务未连接'; }
}

async function addDownload(){
  const url = $('#url').value.trim();
  if (!url) return toast('请先填入链接');
  const body = { url };
  if ($('#fname').value.trim()) body.filename = $('#fname').value.trim();
  if ($('#fconn').value) body.connections = Number($('#fconn').value);
  // 拖拽进来的链接不会触发 input 事件，这里按真正要下的链接对齐一次轨道条；
  // 轨道条收起时不读输入框，免得上一条链接留下的选择器跟着新链接发出去。
  toggleTrkBar();
  if (!$('#trkBar').hidden){
    if ($('#fsv').value.trim()) body.stream_video = $('#fsv').value.trim();
    if ($('#fsa').value.trim()) body.stream_audio = $('#fsa').value.trim();
    if ($('#fss').value.trim()) body.stream_subtitle = $('#fss').value.trim();
    if ($('#fsf').value) body.stream_sub_format = $('#fsf').value;
    if ($('#fliv').value.trim()) body.stream_live_limit = $('#fliv').value.trim();
  }
  const r = await api('POST','tasks',body);
  if (!r.ok) return toast(r.error || '添加失败');
  $('#url').value = ''; $('#fname').value = '';
  ['fsv','fsa','fss','fliv'].forEach(id => { $('#'+id).value = ''; });
  $('#fsf').value = '';
  toggleTrkBar();
  toast('已加入队列');
  refresh();
}
$('#btnGo').onclick = addDownload;
$('#url').addEventListener('keydown', e => { if (e.key === 'Enter') addDownload(); });
$('#btnAdd').onclick = () => $('#url').focus();

// drag & drop a link
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const t = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
  if (t && /^https?:\/\//i.test(t.trim())){ $('#url').value = t.trim(); addDownload(); }
});

document.querySelectorAll('.tab').forEach(el => el.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  el.classList.add('active'); filter = el.dataset.f; render();
});

const bulk = (action, doing, none) => async () => {
  const r = await api('POST','action',{action});
  if (!r.ok) return toast(r.error || '操作失败');
  // changed 是服务端真正改动的任务数：全部已经暂停了再点「全部暂停」，
  // 以前也提示成功，现在说清楚「本来就没有可暂停的任务」。
  const n = Number(r.changed || 0);
  toast(n ? doing.replace('{n}', n) : none);
  refresh();
};
$('#btnPauseAll').onclick = bulk('pause_all', '已暂停 {n} 个任务', '没有正在下载的任务');
$('#btnResumeAll').onclick = bulk('resume_all', '已开始 {n} 个任务', '没有等待开始的任务');
$('#btnClear').onclick = bulk('clear_finished', '已清除 {n} 条记录', '没有已完成的任务');

$('#btnSettings').onclick = () => {
  $('#cfgDir').value = config.download_dir || '';
  $('#cfgConn').value = config.connections || 8;
  $('#cfgActive').value = config.max_active || 3;
  $('#cfgSpeed').value = Math.round((config.speed_limit || 0) / 1024);
  $('#cfgRetry').value = config.max_retries ?? 5;
  $('#cfgProxy').value = config.proxy || '';
  $('#cfgPort').value = config.port || 9000;
  $('#cfgAuto').checked = !!config.auto_resume;
  $('#dlgSettings').showModal();
};
$('#btnSaveCfg').onclick = async () => {
  // 输入框留空时 Number('') === 0：连接数会变成 0（下载退化成单线程）、
  // 任务数 0 直接卡死队列。先按字段名问清楚，比让服务端回「收到 0」好读。
  const num = (sel, label) => {
    const raw = $(sel).value.trim();
    if (raw === '' || !isFinite(Number(raw))) { toast(`${label} 要填数字`); return null; }
    return Number(raw);
  };
  const conn = num('#cfgConn', '单任务连接数'); if (conn === null) return;
  const active = num('#cfgActive', '同时下载任务数'); if (active === null) return;
  const speed = num('#cfgSpeed', '限速'); if (speed === null) return;
  const retry = num('#cfgRetry', '失败重试次数'); if (retry === null) return;
  const port = num('#cfgPort', '服务端口'); if (port === null) return;
  const dir = $('#cfgDir').value.trim();
  if (!dir) { toast('下载目录不能为空'); return; }
  const r = await api('POST','config',{
    download_dir: dir,
    connections: conn,
    max_active: active,
    speed_limit: speed * 1024,
    max_retries: retry,
    proxy: $('#cfgProxy').value.trim(),
    port: port,
    auto_resume: $('#cfgAuto').checked,
  });
  if (r.ok){ toast(r.warning || '已保存（端口需重启服务生效）'); $('#dlgSettings').close(); refresh(); }
  else toast(r.error || '保存失败');
};
$('#btnOpenDir').onclick = async () => {
  const dir = $('#cfgDir').value.trim();
  if (!dir) return toast('请先填写目录');
  const r = await api('POST','open',{path:dir});
  if (!r.ok) toast(r.error || '打开目录失败');
};

let es;
function connectEvents(){
  es = new EventSource('/api/events');
  es.addEventListener('snapshot', e => {
    const d = JSON.parse(e.data); tasks = d.tasks || []; config = d.config || {}; render();
  });
  es.addEventListener('task', e => {
    const d = JSON.parse(e.data);
    if (d.task){
      const i = tasks.findIndex(t => t.id === d.task.id);
      if (i >= 0) tasks[i] = d.task; else tasks.unshift(d.task);
    }
    render();
  });
  es.onerror = () => { $('#svc').textContent = '连接中断，重试中…'; };
}
refresh();
connectEvents();
setInterval(() => { if (es.readyState === 2) { es = null; connectEvents(); } }, 5000);
</script>
