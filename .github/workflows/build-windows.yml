name: build-windows

# Build the Windows client into a self-contained installer and (on a tag) attach
# it to the Release.
#
# The Windows client is the *same* PyQt5 app as macOS/Linux — frozen with the
# same PyInstaller spec (zdm/zdm.spec) and wrapped by Inno Setup. It used to be a
# separate C#/WPF program with its own download engine, which meant every fix had
# to be written twice (the YouTube resolve and DASH audio-mux work never reached
# Windows). windows-native/ is kept in the tree as a reference/rollback only; it
# is no longer built.

on:
  push:
    branches: [main, linux-native]
    tags: ['v*']
  pull_request:
    branches: [main, linux-native]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows client
    runs-on: windows-latest
    # 正常 6~8 分钟（下载 ffmpeg ~130MB + PyInstaller）。留 25 分钟余量：
    # 万一静默安装又卡住（比如 irs 里又加了一条会自动拉起程序的 [Run]），
    # 要尽快失败，而不是把 runner 占满 6 小时。
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # Inno ships only English by default; the installer needs the Simplified
      # Chinese messages file, so pull the official translation.
      - name: Fetch Chinese language file
        shell: pwsh
        run: |
          $langs = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages"
          if (-not (Test-Path $langs)) {
            $langs = "${env:ProgramFiles(x86)}\Inno Setup 7\Languages"
          }
          New-Item -ItemType Directory -Force -Path $langs | Out-Null

          $target = Join-Path $langs 'ChineseSimplified.isl'
          if (Test-Path $target) { Write-Host "already present"; exit 0 }

          $url = 'https://raw.githubusercontent.com/kira-96/Inno-Setup-Chinese-Simplified-translation/main/ChineseSimplified.isl'
          Invoke-WebRequest $url -OutFile $target -UseBasicParsing
          Write-Host "downloaded -> $target"

      # One script does the whole job: venv, PyQt5 + PyInstaller, fetch
      # bin/yt-dlp.exe + bin/ffmpeg.exe, freeze, self-check, Inno.
      # Running it here (instead of inlining the steps) is what makes a local
      # build and a CI build produce the same artifact.
      - name: Build bundle + installer
        shell: pwsh
        run: ./zdm/build_windows_app.ps1 -OutDir dist

      - name: Locate installer
        id: find
        shell: pwsh
        run: |
          $f = Get-ChildItem dist -Filter 'ZDM-Setup-*.exe' | Select-Object -First 1
          if (-not $f) { throw "no installer produced" }
          "path=$($f.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($f.Name)" >> $env:GITHUB_OUTPUT
          "size=$([math]::Round($f.Length / 1MB, 1))MB" >> $env:GITHUB_OUTPUT
          Write-Host "$($f.Name) $([math]::Round($f.Length / 1MB, 1))MB"

      # ------------------------------------------------------------ self-check
      # Install for real, then run the installed exe twice:
      #   1. --selfcheck  -> bundled PyQt5 / web / extension / theme are present
      #   2. no args      -> the service binds 9000 and answers /api/state
      # A build that would fail on a user's machine must fail here instead.
      - name: Install and verify
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter 'ZDM-Setup-*.exe' | Select-Object -First 1
          $log = Join-Path $env:RUNNER_TEMP 'install.log'

          $p = Start-Process -FilePath $setup.FullName `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NORUN /LOG=$log" `
            -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 40 | Write-Host
            throw "installer failed: $($p.ExitCode)"
          }

          $app = Join-Path $env:LOCALAPPDATA 'Programs\ZDM'
          $exe = Join-Path $app 'ZDM.exe'
          if (-not (Test-Path $exe)) { throw "installed exe missing: $exe" }
          foreach ($need in @('ZDM-NativeHost.exe', '_internal\bin\yt-dlp.exe', '_internal\bin\ffmpeg.exe',
                              '_internal\extension\manifest.json', 'extension\manifest.json',
                              'com.zdm.launcher.json')) {
            if (-not (Test-Path (Join-Path $app $need))) { throw "missing in install dir: $need" }
          }

          # The windowed exe has no stdout, so the report goes through a file.
          $report = Join-Path $env:RUNNER_TEMP 'selfcheck.json'
          $env:ZDM_SELFCHECK_OUT = $report
          $sc = Start-Process -FilePath $exe -ArgumentList '--selfcheck' -Wait -PassThru -NoNewWindow
          $env:ZDM_SELFCHECK_OUT = ''
          if (Test-Path $report) { Get-Content $report | Write-Host }
          if ($sc.ExitCode -ne 0) { throw "self-check failed: exit $($sc.ExitCode)" }

          # Now the real thing: start it and wait for the local API.
          Start-Process -FilePath $exe | Out-Null
          $deadline = (Get-Date).AddSeconds(60)
          $ok = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest 'http://127.0.0.1:9000/api/state' -TimeoutSec 4 -UseBasicParsing
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if (-not $ok) {
            Get-Process ZDM -ErrorAction SilentlyContinue | Format-Table | Write-Host
            throw "local API never answered on port 9000"
          }

          $ver = (Invoke-WebRequest 'http://127.0.0.1:9000/api' -TimeoutSec 4 -UseBasicParsing).Content
          Write-Host "api: $ver"
          Get-Process ZDM -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "self-check passed"

      # --------------------------------------------------------------- upload
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZDM-Windows-installer
          path: dist/ZDM-Setup-*.exe
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZDM-Setup-*.exe
          fail_on_unmatched_files: true
