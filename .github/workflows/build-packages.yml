name: build packages

# Builds every platform package:
#   ubuntu-22.04  -> self-contained Linux bundle + .deb + portable tar.gz, Windows .exe
#   macos-latest  -> macOS ZDM.app + ZDM-<version>.dmg (native Mach-O launcher)
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-windows:
    # ubuntu-22.04 (glibc 2.35) is the oldest runner still offered, so the
    # frozen bundle runs on Ubuntu 22.04+/Debian 12+/Mint 21+. Newer runners
    # would raise the glibc floor and break those distros.
    # Ubuntu also has dpkg-deb, and the Windows .exe is assembled here with 7zS.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full dpkg-dev xvfb python3-venv libgl1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libegl1

      - name: Show versions
        run: |
          python3 --version
          7z | head -2
          dpkg-deb --version | head -1
          xvfb-run --help >/dev/null && echo "xvfb ok"

      - name: Build packages (Linux native bundle + .deb + Windows exe)
        run: python3 build_dist.py

      - name: List artifacts
        run: ls -la dist/

      - name: Verify the .deb is a real self-contained package
        run: |
          set -e
          DEB=$(ls -t dist/zdm_*.deb | head -1)
          echo "==> inspecting $DEB"
          dpkg-deb --info "$DEB"
          # The bundle must be inside the package - this is exactly what the old
          # 87 KB "shell" .deb got wrong.
          N=$(dpkg-deb --contents "$DEB" | grep -c '/opt/zdm/_internal/' || true)
          echo "bundled files under /opt/zdm/_internal: $N"
          test "$N" -gt 100 || { echo "ERROR: no bundled runtime in $DEB"; exit 1; }
          dpkg-deb --contents "$DEB" | grep -q '/opt/zdm/ZDM$'
          dpkg-deb --contents "$DEB" | grep -q 'usr/bin/zdm-desktop'
          # A source-only package would be a few hundred KB. Anything under
          # 10 MB means the runtime is missing again.
          SZ=$(stat -c%s "$DEB")
          echo "deb size: $SZ bytes"
          test "$SZ" -gt 10000000 || { echo "ERROR: $DEB is too small to contain a runtime"; exit 1; }
          echo "control version: $(dpkg-deb --field "$DEB" Version)"
          echo "control arch:    $(dpkg-deb --field "$DEB" Architecture)"
          echo "installed size:  $(dpkg-deb --field "$DEB" Installed-Size) KB"
          # No pip / interpreter game in the maintainer scripts any more.
          rm -rf /tmp/ctrl && mkdir -p /tmp/ctrl
          dpkg-deb --ctrl-tarfile "$DEB" | tar -x -C /tmp/ctrl ./postinst
          if grep -q "pip install" /tmp/ctrl/postinst; then
            echo "ERROR: postinst still pip-installs something"; exit 1
          fi
          grep -q "update-desktop-database" /tmp/ctrl/postinst

      - name: Run the packaged app out of an extracted tree
        run: |
          set -e
          DEB=$(ls -t dist/zdm_*.deb | head -1)
          rm -rf /tmp/zdmdeb && mkdir -p /tmp/zdmdeb
          dpkg-deb -x "$DEB" /tmp/zdmdeb
          test -x /tmp/zdmdeb/opt/zdm/ZDM
          file /tmp/zdmdeb/opt/zdm/ZDM
          /tmp/zdmdeb/opt/zdm/ZDM --selfcheck
          /tmp/zdmdeb/opt/zdm/ZDM --version
          /tmp/zdmdeb/opt/zdm/ZDM --help | head -5

      - name: Install the .deb in a clean Debian container (no python, no pip)
        run: |
          set -e
          DEB=$(ls -t dist/zdm_*.deb | head -1)
          docker run --rm -v "$PWD/$DEB:/tmp/zdm.deb:ro" debian:12 bash -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq /tmp/zdm.deb xvfb >/tmp/install.log 2>&1 || { tail -30 /tmp/install.log; exit 1; }
            echo "--- installed ---"
            ls -l /opt/zdm/ZDM /usr/bin/zdm /usr/bin/zdm-desktop
            /usr/bin/zdm --version
            /usr/bin/zdm --selfcheck
            test -f /usr/share/applications/zdm.desktop
            # the point of the whole exercise: the window opens with no Python
            timeout 90 xvfb-run -a /usr/bin/zdm-desktop 9123 --smoke
            echo "desktop client started and quit cleanly under Xvfb"
          '

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zdm-packages
          path: |
            dist/zdm_*.deb
            dist/zdm-linux-*.tar.gz
            dist/ZDM-PyQt5-Setup-*.exe
            dist/README.txt
          if-no-files-found: error

      # Attach the freshly built packages to the GitHub release when a tag is pushed.
      - name: Attach packages to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zdm_*.deb
            dist/zdm-linux-*.tar.gz
            dist/ZDM-PyQt5-Setup-*.exe
          fail_on_unmatched_files: false

  macos:
    # The .dmg needs hdiutil, and ZDM.app's native launcher needs clang +
    # a Python.framework with libpython + headers (both ship with the Xcode
    # command line tools, which macos-latest already has).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select -p
          clang --version | head -2
          python3 -V
          hdiutil help >/dev/null && echo "hdiutil ok"

      - name: Resolve version from tag, else from zdm/__init__.py
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            V=$(grep -E '^__version__' zdm/zdm/__init__.py | head -1 | cut -d'"' -f2)
            echo "version=$V" >> "$GITHUB_OUTPUT"
          fi
          echo "building version ${{ steps.ver.outputs.version }}"

      - name: Build ZDM.app and .dmg (with launch smoke test)
        run: |
          bash zdm/build_macos_app.sh "$RUNNER_TEMP/zdm-macos" "${{ steps.ver.outputs.version }}"

      - name: Verify app bundle contents and version
        run: |
          set -e
          APP="$RUNNER_TEMP/zdm-macos/ZDM.app"
          RES="$APP/Contents/Resources"
          test -f "$RES/theme.py"
          test -f "$RES/zdm/update.py"
          test -f "$RES/zdm/desktop.py"
          PLIST_V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")
          SRC_V=$(grep -E '^__version__' zdm/zdm/__init__.py | head -1 | cut -d'"' -f2)
          echo "plist=$PLIST_V source=$SRC_V"
          [ "$PLIST_V" = "$SRC_V" ] || { echo "ERROR: version mismatch in bundle"; exit 1; }
          # update/desktop must import inside the bundle's own runtime
          "$RES/venv/bin/python" -c "
          import sys; sys.path.insert(0, '$RES')
          from zdm import update, desktop
          assert update.is_newer('1.3.0', '1.2.0')
          print('bundle update+desktop modules OK')
          "

      - name: Upload the .dmg
        uses: actions/upload-artifact@v4
        with:
          name: zdm-macos-dmg
          path: ${{ runner.temp }}/zdm-macos/ZDM-*.dmg
          if-no-files-found: error

      - name: Attach the .dmg to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/zdm-macos/ZDM-*.dmg
          fail_on_unmatched_files: false
