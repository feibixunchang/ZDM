name: build packages

# Builds every platform package:
#   ubuntu-latest -> Linux .deb + zdm-linux.tar.gz + Windows .exe
#   macos-latest  -> macOS ZDM.app + ZDM-<version>.dmg (native Mach-O launcher)
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-windows:
    # Ubuntu has dpkg-deb; Windows packages are assembled here with 7zS.sfx too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full dpkg-dev

      - name: Show versions
        run: |
          python3 --version
          7z | head -2
          dpkg-deb --version | head -1

      - name: Build packages
        run: python3 build_dist.py

      - name: List artifacts
        run: ls -la dist/

      - name: Sanity-check the .deb
        run: |
          set -e
          # Resolve the freshly built deb explicitly: dist/ may still contain an
          # older artifact from a previous run, and a glob would match both.
          DEB=$(ls -t dist/zdm_*_all.deb | head -1)
          echo "==> inspecting $DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB" | head -20
          echo "==> control Version:"
          dpkg-deb --field "$DEB" Version

      - name: Verify the .deb installs cleanly (container smoke test)
        run: |
          set -e
          DEB="$PWD/$(ls -t dist/zdm_*_all.deb | head -1)"
          # NOTE: pass an absolute path. "apt-get install dist/zdm_x.deb" makes apt
          # treat "dist" as a *package name* and look for it in the configured
          # repos -> "Package dist is not available".
          sudo apt-get install -y "$DEB"
          # the CLI wrapper must exist and be executable
          test -x /usr/local/bin/zdm
          # the desktop entry + icon must be installed
          test -f /usr/local/share/applications/zdm.desktop
          test -f /usr/local/share/icons/hicolor/128x128/apps/zdm.png
          # core engine must import and report its version
          python3 -c "import sys; sys.path.insert(0,'/usr/local/share/zdm'); import zdm; print('engine version', zdm.__version__)"
          # CLI must run and show help without a TTY
          /usr/local/bin/zdm --help | head -5
          echo "==> .deb install smoke test passed"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zdm-packages
          path: |
            dist/zdm_*_all.deb
            dist/zdm-linux.tar.gz
            dist/ZDM-Setup-*.exe
            dist/README.txt
          if-no-files-found: error

      # Attach the freshly built packages to the GitHub release when a tag is pushed.
      - name: Attach packages to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zdm_*_all.deb
            dist/zdm-linux.tar.gz
            dist/ZDM-Setup-*.exe
          fail_on_unmatched_files: false
  macos:
    # The .dmg needs hdiutil, and ZDM.app's native launcher needs clang +
    # a Python.framework with libpython + headers (both ship with the Xcode
    # command line tools, which macos-latest already has).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select -p
          clang --version | head -2
          python3 -V
          hdiutil help >/dev/null && echo "hdiutil ok"

      - name: Resolve version from tag, else from zdm/__init__.py
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            V=$(grep -E '^__version__' zdm/zdm/__init__.py | head -1 | cut -d'"' -f2)
            echo "version=$V" >> "$GITHUB_OUTPUT"
          fi
          echo "building version ${{ steps.ver.outputs.version }}"

      - name: Build ZDM.app and .dmg (with launch smoke test)
        run: |
          bash zdm/build_macos_app.sh "$RUNNER_TEMP/zdm-macos" "${{ steps.ver.outputs.version }}"

      - name: Upload the .dmg
        uses: actions/upload-artifact@v4
        with:
          name: zdm-macos-dmg
          path: ${{ runner.temp }}/zdm-macos/ZDM-*.dmg
          if-no-files-found: error

      - name: Attach the .dmg to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/zdm-macos/ZDM-*.dmg
          fail_on_unmatched_files: false
