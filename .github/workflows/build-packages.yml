name: build packages

# Builds every platform package:
#   ubuntu-22.04  -> self-contained Linux bundle + .deb + portable tar.gz, Windows .exe
#   macos-latest  -> macOS ZDM.app + ZDM-<version>.dmg (native Mach-O launcher)
#
# linux-native is listed alongside main because that is where the cross-platform
# work actually happens; without it a branch push produced no compile check for
# the C# client or any of the packaging.
on:
  push:
    branches: [main, linux-native]
    tags: ["v*"]
  pull_request:
    branches: [main, linux-native]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extension:
    # Cheap gate that runs before any packaging: the browser extension is pure
    # JS, so a syntax error or a manifest that lost its "key" (which silently
    # changes the extension id and invalidates every registered native
    # messaging host) is caught in seconds instead of after a 20-minute build.
    name: Browser extension sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check every script
        run: |
          set -e
          for f in zdm/extension/*.js; do
            echo "== $f"
            node --check "$f"
          done

      - name: Validate the manifest
        run: |
          set -e
          python3 - <<'PY'
          import base64, hashlib, json, re, sys, pathlib
          m = json.load(open("zdm/extension/manifest.json"))
          assert m["manifest_version"] == 3, "must stay MV3"
          # The id is derived from the embedded key; if the key is edited or
          # dropped the id changes and every native-messaging manifest written
          # by an older client stops matching.
          key = m.get("key")
          assert key, "manifest.key is gone - the extension id would change"
          der = base64.b64decode(key)
          digest = hashlib.sha256(der).digest()[:16]
          alpha = "abcdefghijklmnop"
          ident = "".join(alpha[(b >> 4) & 15] + alpha[b & 15] for b in digest)
          expected = "mpodbnemeeghjpllgphpemhoogddfhjg"
          print("derived extension id:", ident)
          assert ident == expected, f"extension id drifted: {ident}"
          # Every file the manifest names must exist.
          root = pathlib.Path("zdm/extension")
          for f in m.get("content_scripts", []):
              for js in f["js"]:
                  assert (root / js).is_file(), f"missing content script {js}"
          assert (root / m["background"]["service_worker"]).is_file()
          assert (root / m["action"]["default_popup"]).is_file()
          assert (root / m["options_ui"]["page"]).is_file()
          for p in m["icons"].values():
              assert (root / p).is_file(), f"missing icon {p}"
          # Sniffing needs webRequest plus ordinary http(s) host access.
          assert "webRequest" in m["permissions"], "sniffer needs webRequest"
          assert "http://*/*" in m["host_permissions"]
          assert "https://*/*" in m["host_permissions"]
          print("manifest OK:", m["name"], m["version"])
          PY

  linux-windows:
    # ubuntu-22.04 (glibc 2.35) is the oldest runner still offered, so the
    # frozen bundle runs on Ubuntu 22.04+/Debian 12+/Mint 21+. Newer runners
    # would raise the glibc floor and break those distros.
    # Ubuntu also has dpkg-deb. Windows 的安装包不在这里产出 —— 原生客户端是
    # C#/WPF，由 build-windows.yml 单独构建；PyQt5 版已经下线（两个安装包并存
    # 会让用户装错，且 PyQt5 版会覆盖原生版的安装目录）。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full dpkg-dev xvfb python3-venv libgl1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libegl1

      - name: Show versions
        run: |
          python3 --version
          7z | head -2
          dpkg-deb --version | head -1
          xvfb-run --help >/dev/null && echo "xvfb ok"

      # YouTube 解析/下载靠随包的 yt-dlp 单文件二进制（pip 包要求 Python 3.10+，
      # 内嵌解释器是 3.9 时 import 会直接失败）。仓库不存这个 30MB 的二进制，
      # 构建时按固定版本取，避免「源码跑得好、装完 YouTube 不能用」。
      # 版本要和本地部署的那份一致，别用 latest —— 否则同一个 tag 两次构建结果不同。
      - name: Fetch bundled yt-dlp (Linux)
        run: |
          set -euo pipefail
          V=2026.08.19
          mkdir -p zdm/bin
          curl -fsSL --retry 3 -o zdm/bin/yt-dlp \
            "https://github.com/yt-dlp/yt-dlp/releases/download/${V}/yt-dlp_linux"
          chmod +x zdm/bin/yt-dlp
          zdm/bin/yt-dlp --version

      # B站/YouTube 的 DASH 视频轨本身没有声音，合流靠 ffmpeg。
      # 不随包的话，用户没装 ffmpeg 就会得到「下载成功但打开是无声视频」——
      # 看起来像下载坏了，其实是缺一个合并器。构建期缺这个文件直接让构建失败，
      # 别等到用户听不见声音才回滚。
      - name: Fetch bundled ffmpeg (Linux)
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) A=ffmpeg-linux-arm64 ;;
            *)             A=ffmpeg-linux-x64 ;;
          esac
          mkdir -p zdm/bin
          curl -fsSL --retry 3 -o zdm/bin/ffmpeg \
            "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/${A}"
          chmod +x zdm/bin/ffmpeg
          zdm/bin/ffmpeg -version | head -1

      - name: Build packages (Linux native bundle + .deb)
        run: python3 build_dist.py

      - name: List artifacts
        run: ls -la dist/

      - name: Verify the .deb is a real self-contained package
        run: |
          set -e
          DEB=$(ls -t dist/zdm_*.deb | head -1)
          echo "==> inspecting $DEB"
          dpkg-deb --info "$DEB"
          # The bundle must be inside the package - this is exactly what the old
          # 87 KB "shell" .deb got wrong.
          N=$(dpkg-deb --contents "$DEB" | grep -c '/opt/zdm/_internal/' || true)
          echo "bundled files under /opt/zdm/_internal: $N"
          test "$N" -gt 100 || { echo "ERROR: no bundled runtime in $DEB"; exit 1; }
          dpkg-deb --contents "$DEB" | grep -q '/opt/zdm/ZDM$'
          dpkg-deb --contents "$DEB" | grep -q 'usr/bin/zdm-desktop'
          # A source-only package would be a few hundred KB. Anything under
          # 10 MB means the runtime is missing again.
          SZ=$(stat -c%s "$DEB")
          echo "deb size: $SZ bytes"
          test "$SZ" -gt 10000000 || { echo "ERROR: $DEB is too small to contain a runtime"; exit 1; }
          # Browser integration must ship in the package: without the native
          # messaging host the extension's "wake ZDM up" path silently falls
          # back to zdm://, which Chrome blocks without a user gesture.
          dpkg-deb --contents "$DEB" | grep -q 'etc/opt/chrome/native-messaging-hosts/com.zdm.launcher.json'
          dpkg-deb --contents "$DEB" | grep -q 'etc/chromium/native-messaging-hosts/com.zdm.launcher.json'
          # ...and the host manifest must point at the bundled wrapper, not at
          # a script that only exists in the source tree.
          rm -rf /tmp/nmh && mkdir -p /tmp/nmh
          dpkg-deb -x "$DEB" /tmp/nmh
          grep -q '/opt/zdm/zdm-native-host' /tmp/nmh/etc/opt/chrome/native-messaging-hosts/com.zdm.launcher.json
          test -x /tmp/nmh/opt/zdm/zdm-native-host
          # The wrapper must exec the frozen exe with the host flag; a wrapper
          # that drops the arguments answers nothing and the extension times out.
          grep -q -- '--native-host' /tmp/nmh/opt/zdm/zdm-native-host
          # zdm:// must be registered, or clicking a handover does nothing.
          grep -q 'x-scheme-handler/zdm' /tmp/nmh/usr/share/applications/zdm.desktop
          echo "control version: $(dpkg-deb --field "$DEB" Version)"
          echo "control arch:    $(dpkg-deb --field "$DEB" Architecture)"
          echo "installed size:  $(dpkg-deb --field "$DEB" Installed-Size) KB"
          # No pip / interpreter game in the maintainer scripts any more.
          rm -rf /tmp/ctrl && mkdir -p /tmp/ctrl
          dpkg-deb --ctrl-tarfile "$DEB" | tar -x -C /tmp/ctrl ./postinst
          if grep -q "pip install" /tmp/ctrl/postinst; then
            echo "ERROR: postinst still pip-installs something"; exit 1
          fi
          grep -q "update-desktop-database" /tmp/ctrl/postinst

      - name: Run the packaged app out of an extracted tree
        run: |
          set -e
          DEB=$(ls -t dist/zdm_*.deb | head -1)
          rm -rf /tmp/zdmdeb && mkdir -p /tmp/zdmdeb
          dpkg-deb -x "$DEB" /tmp/zdmdeb
          test -x /tmp/zdmdeb/opt/zdm/ZDM
          file /tmp/zdmdeb/opt/zdm/ZDM
          /tmp/zdmdeb/opt/zdm/ZDM --selfcheck
          /tmp/zdmdeb/opt/zdm/ZDM --version
          /tmp/zdmdeb/opt/zdm/ZDM --help | head -5

      - name: Install the .deb in a clean Debian container (no python, no pip)
        run: |
          set -e
          DEB=$(ls -t dist/zdm_*.deb | head -1)
          docker run --rm -v "$PWD/$DEB:/tmp/zdm.deb:ro" debian:12 bash -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq /tmp/zdm.deb xvfb >/tmp/install.log 2>&1 || { tail -30 /tmp/install.log; exit 1; }
            echo "--- installed ---"
            ls -l /opt/zdm/ZDM /usr/bin/zdm /usr/bin/zdm-desktop
            /usr/bin/zdm --version
            /usr/bin/zdm --selfcheck
            test -f /usr/share/applications/zdm.desktop
            # the point of the whole exercise: the window opens with no Python
            timeout 90 xvfb-run -a /usr/bin/zdm-desktop 9123 --smoke
            echo "desktop client started and quit cleanly under Xvfb"
          '

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zdm-packages
          path: |
            dist/zdm_*.deb
            dist/zdm-linux-*.tar.gz
            dist/README.txt
          if-no-files-found: error

      # Attach the freshly built packages to the GitHub release when a tag is pushed.
      - name: Attach packages to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zdm_*.deb
            dist/zdm-linux-*.tar.gz
          fail_on_unmatched_files: false

  macos:
    # The .dmg needs hdiutil, and ZDM.app's native launcher needs clang +
    # a Python.framework with libpython + headers (both ship with the Xcode
    # command line tools, which macos-latest already has).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcode-select -p
          clang --version | head -2
          python3 -V
          hdiutil help >/dev/null && echo "hdiutil ok"

      - name: Resolve version from tag, else from zdm/__init__.py
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            V=$(grep -E '^__version__' zdm/zdm/__init__.py | head -1 | cut -d'"' -f2)
            echo "version=$V" >> "$GITHUB_OUTPUT"
          fi
          echo "building version ${{ steps.ver.outputs.version }}"

      # 同 Linux：YouTube 走随包的单文件 yt-dlp，pip 包在 3.9 上 import 会抛
      # "unsupported version of Python"。固定版本，别用 latest。
      - name: Fetch bundled yt-dlp (macOS)
        run: |
          set -euo pipefail
          V=2026.08.19
          mkdir -p zdm/bin
          curl -fsSL --retry 3 -o zdm/bin/yt-dlp \
            "https://github.com/yt-dlp/yt-dlp/releases/download/${V}/yt-dlp_macos"
          chmod +x zdm/bin/yt-dlp
          zdm/bin/yt-dlp --version

      # 同 Linux：DASH 音轨合流需要 ffmpeg，构建期缺了直接失败。
      - name: Fetch bundled ffmpeg (macOS)
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) A=ffmpeg-darwin-arm64 ;;
            *)     A=ffmpeg-darwin-x64 ;;
          esac
          mkdir -p zdm/bin
          curl -fsSL --retry 3 -o zdm/bin/ffmpeg \
            "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/${A}"
          chmod +x zdm/bin/ffmpeg
          zdm/bin/ffmpeg -version | head -1

      - name: Build ZDM.app and .dmg (with launch smoke test)
        run: |
          bash zdm/build_macos_app.sh "$RUNNER_TEMP/zdm-macos" "${{ steps.ver.outputs.version }}"

      - name: Verify app bundle contents and version
        run: |
          set -e
          APP="$RUNNER_TEMP/zdm-macos/ZDM.app"
          RES="$APP/Contents/Resources"
          test -f "$RES/theme.py"
          test -f "$RES/zdm/update.py"
          test -f "$RES/zdm/desktop.py"
          # 随包的 yt-dlp 二进制：漏了就只剩「源码能用、装完不能用」
          test -x "$RES/bin/yt-dlp" || { echo "ERROR: 随包 yt-dlp 缺失或不可执行"; exit 1; }
          "$RES/bin/yt-dlp" --version
          PLIST_V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")
          SRC_V=$(grep -E '^__version__' zdm/zdm/__init__.py | head -1 | cut -d'"' -f2)
          echo "plist=$PLIST_V source=$SRC_V"
          [ "$PLIST_V" = "$SRC_V" ] || { echo "ERROR: version mismatch in bundle"; exit 1; }
          # update/desktop must import inside the bundle's own runtime
          "$RES/venv/bin/python" -c "
          import sys; sys.path.insert(0, '$RES')
          from zdm import update, desktop
          assert update.is_newer('1.3.0', '1.2.0')
          print('bundle update+desktop modules OK')
          "

      - name: Upload the .dmg
        uses: actions/upload-artifact@v4
        with:
          name: zdm-macos-dmg
          path: ${{ runner.temp }}/zdm-macos/ZDM-*.dmg
          if-no-files-found: error

      - name: Attach the .dmg to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/zdm-macos/ZDM-*.dmg
          fail_on_unmatched_files: false
