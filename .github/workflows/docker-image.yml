name: docker-image

# 构建并推送 ZDM 服务端镜像到 GHCR（打 v* 标签或手动触发时）。
# 镜像：ghcr.io/feibixunchang/zdm-server:<tag|latest>（amd64 + arm64 双架构，覆盖 x86 与 ARM 的 NAS）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/feibixunchang/zdm-server:latest
            ghcr.io/feibixunchang/zdm-server:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
